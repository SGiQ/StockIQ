name = "stockiq-market"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# The Finnhub key is NOT here. Set it as a secret (write-only from the CLI, it
# never appears in this file, the repo, or the deployed bundle):
#   npx wrangler secret put FINNHUB_API_KEY

# Optional per-caller daily cap to protect the Finnhub free-tier quota. Unlike
# the ASK worker this fails OPEN (quotes are free/cheap, not LLM spend), so it's
# OFF by default — the Worker deploys and runs uncapped without it. To enable
# it, create a namespace, then uncomment the block below and paste its id:
#   npx wrangler kv namespace create RATE_LIMIT
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
DAILY_LIMIT = "2000"
