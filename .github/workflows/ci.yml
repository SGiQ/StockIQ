name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate content index
        run: npm run gen:content

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Validate content
        run: npm run validate:content

      - name: Validator self-test
        run: npm run test:validator

      - name: Expo export (web)
        run: npx expo export --platform web

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Telemetry tests
        run: npm run test:telemetry

      - name: Leagues tests
        run: npm run test:leagues

      - name: Unit tests
        run: npm test

  workers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [ask, market, narration]
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
